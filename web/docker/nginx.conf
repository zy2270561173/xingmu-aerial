map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

upstream tvcast_backend {
    server backend:18000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 210m;

    location /api/ {
        proxy_pass http://tvcast_backend;
        include /etc/nginx/proxy_params;
    }

    location /ws/ {
        proxy_pass http://tvcast_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite instead of appending: the app decides LAN-vs-remote from this address, and
        # $proxy_add_x_forwarded_for would forward a client-supplied value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://tvcast_backend;
        include /etc/nginx/proxy_params;
    }

    location = /player {
        proxy_pass http://tvcast_backend;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
    }

    location ^~ /player/ {
        proxy_pass http://tvcast_backend;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
    }

    location = /palyer {
        proxy_pass http://tvcast_backend;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
    }

    location ^~ /pair/ {
        proxy_pass http://tvcast_backend;
        include /etc/nginx/proxy_params;
    }

    location = /openapi.json {
        proxy_pass http://tvcast_backend;
        include /etc/nginx/proxy_params;
    }

    location ^~ /docs {
        proxy_pass http://tvcast_backend;
        include /etc/nginx/proxy_params;
    }

    location ^~ /redoc {
        proxy_pass http://tvcast_backend;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
