<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<!-- The URL carries the signed token; never send it to a cover CDN as a Referer. -->
<meta name="referrer" content="no-referrer">
<title>星幕点歌台</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f5f5f7;
    --dim: rgba(235,235,245,.66);
    --faint: rgba(235,235,245,.38);
    --glass: rgba(20,20,28,.44);
    --glass-strong: rgba(28,28,38,.58);
    --line: rgba(255,255,255,.14);
    --accent: #8f7cff;
    --good: #7ef0a5;
    --bad: #ff8f86;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  html { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.32) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.30); border-radius: 99px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: #08080c url('/api/wallpaper/bing') center / cover fixed no-repeat;
    padding: 22px 16px 42px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      linear-gradient(180deg, rgba(5,6,12,.50) 0%, rgba(5,6,12,.74) 48%, rgba(5,6,12,.94) 100%);
    pointer-events: none;
  }
  .wrap { max-width: 680px; margin: 0 auto; position: relative; }
  header { display: flex; align-items: center; gap: 12px; margin: 4px 2px 18px; }
  .logo {
    width: 44px; height: 44px; border-radius: 14px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 23px;
    background: linear-gradient(145deg, rgba(143,124,255,.96), rgba(74,58,214,.96));
    border: 1px solid rgba(255,255,255,.28);
    box-shadow: 0 10px 30px rgba(90,70,255,.42), inset 0 1px 0 rgba(255,255,255,.35);
    text-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; font-weight: 650; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
  .sub { margin: 3px 0 0; font-size: 12px; color: var(--dim); text-shadow: 0 1px 10px rgba(0,0,0,.6); }
  .card {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 22px;
    backdrop-filter: blur(26px) saturate(150%);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
    box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .search-card { padding: 14px; }
  .search { display: flex; gap: 9px; }
  input[type=search] {
    flex: 1; width: 0; min-width: 0; height: 46px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.30);
    color: var(--ink); padding: 0 14px; font-size: 16px; outline: none;
  }
  input[type=search]::placeholder { color: var(--faint); }
  input[type=search]:focus { border-color: rgba(143,124,255,.75); box-shadow: 0 0 0 3px rgba(143,124,255,.18); }
  button { font-family: inherit; cursor: pointer; }
  .go {
    height: 46px; padding: 0 20px; border: 0; border-radius: 14px; font-size: 15px; font-weight: 650;
    color: #fff; background: linear-gradient(145deg, #9a89ff, #5b48e8);
    border: 1px solid rgba(255,255,255,.26);
    box-shadow: 0 8px 22px rgba(90,70,255,.38), inset 0 1px 0 rgba(255,255,255,.26);
  }
  .go:active { transform: scale(.97); }
  .quality { display: flex; gap: 7px; margin: 12px 2px 0; flex-wrap: wrap; }
  .chip {
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05);
    color: var(--dim); border-radius: 99px; padding: 7px 13px; font-size: 12px;
  }
  .chip.on { color: #fff; border-color: rgba(143,124,255,.72); background: rgba(143,124,255,.25); }
  .status { min-height: 20px; margin: 10px 4px 0; font-size: 12.5px; color: var(--dim); }
  .status.bad { color: var(--bad); }
  .status.good { color: var(--good); }
  #results { margin-top: 10px; }
  .result {
    display: flex; gap: 10px; align-items: center; padding: 10px 4px;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .result:last-child { border-bottom: 0; }
  .cover { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; background: rgba(255,255,255,.08); flex: 0 0 auto; }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .singer { font-size: 12px; color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album { font-size: 11px; color: var(--faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick {
    border: 1px solid rgba(143,124,255,.55); background: rgba(143,124,255,.20); color: #d9d2ff;
    border-radius: 12px; height: 36px; padding: 0 15px; font-size: 13px; font-weight: 600; flex: 0 0 auto;
  }
  .pick:active { transform: scale(.95); }
  .pick[disabled] { opacity: .45; }
  .empty { color: var(--faint); font-size: 13px; text-align: center; padding: 25px 0; }
  h2 {
    font-size: 13px; color: var(--dim); font-weight: 600; margin: 22px 4px 9px;
    letter-spacing: .5px; display: flex; align-items: baseline; gap: 7px;
    text-shadow: 0 1px 10px rgba(0,0,0,.6);
  }
  h2 .count { color: var(--faint); font-weight: 500; font-size: 11px; }
  .now {
    padding: 14px; margin-bottom: 10px; display: flex; gap: 13px; align-items: center;
    border-color: rgba(143,124,255,.35);
    background: linear-gradient(135deg, rgba(143,124,255,.20), rgba(20,20,28,.48) 55%);
  }
  .now .big-cover { width: 66px; height: 66px; border-radius: 16px; object-fit: cover; background: rgba(255,255,255,.08); flex: 0 0 auto; }
  .now .meta { min-width: 0; }
  .now .name { font-size: 17px; }
  .now .badge {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 5px;
    font-size: 11px; color: var(--dim); background: rgba(0,0,0,.24);
    border: 1px solid rgba(255,255,255,.10); border-radius: 99px; padding: 3px 9px;
  }
  .now .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .now .badge.playing .dot { background: var(--good); box-shadow: 0 0 8px rgba(126,240,165,.6); }
  .now .skip {
    margin-left: auto; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.16);
    background: rgba(0,0,0,.20); color: var(--dim); border-radius: 11px; height: 34px; padding: 0 12px; font-size: 12px;
  }
  .queue-card { padding: 8px 8px 8px 6px; }
  .queue-list {
    max-height: 47vh; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.34) transparent;
    border-radius: 16px;
  }
  .queue-list::-webkit-scrollbar { width: 7px; }
  .queue-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.30); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  .queue-item {
    display: flex; gap: 10px; align-items: center; padding: 9px 7px;
    border-bottom: 1px solid rgba(255,255,255,.07);
    background: transparent; border-radius: 12px;
    transition: background .14s ease, transform .14s ease, opacity .14s ease;
  }
  .queue-item:last-child { border-bottom: 0; }
  .queue-item.dragging { opacity: .55; transform: scale(.985); background: rgba(143,124,255,.16); }
  .queue-item .cover { width: 42px; height: 42px; border-radius: 10px; }
  .queue-item .meta { min-width: 0; }
  .queue-item .name { font-size: 14px; }
  .queue-item .singer { font-size: 11.5px; }
  .grip {
    width: 30px; height: 34px; flex: 0 0 auto; display: grid; place-items: center;
    color: var(--faint); font-size: 17px; letter-spacing: -2px; touch-action: none;
    border-radius: 8px; cursor: grab;
  }
  .grip:active { background: rgba(255,255,255,.08); color: var(--dim); }
  .del {
    width: 32px; height: 32px; flex: 0 0 auto; border: 0; border-radius: 10px;
    background: rgba(255,255,255,.06); color: var(--faint); font-size: 18px; line-height: 1;
  }
  .del:active { background: rgba(255,90,80,.22); color: var(--bad); }
  footer { text-align: center; color: var(--faint); font-size: 11px; margin-top: 24px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (max-width: 380px) {
    .now .big-cover { width: 54px; height: 54px; }
    .grip { width: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">♪</div>
    <div>
      <h1>星幕点歌台</h1>
      <p class="sub">手机扫码点歌 · 拖动排序 · 电视实时同步</p>
    </div>
  </header>

  <section class="card search-card">
    <div class="search">
      <input id="q" type="search" placeholder="搜索歌名 / 歌手" enterkeyhint="search" autocomplete="off" spellcheck="false">
      <button id="searchBtn" class="go">搜索</button>
    </div>
    <div class="quality" id="quality">
      <button class="chip on" data-q="MP3_320">高品质 320K</button>
      <button class="chip" data-q="ACC_192">AAC 192K</button>
      <button class="chip" data-q="MP3_128">标准 128K</button>
    </div>
    <div class="status" id="status"></div>
    <div id="results"><div class="empty">输入歌名或歌手，开始点歌</div></div>
  </section>

  <h2>已点歌单 <span class="count" id="queueCount"></span></h2>
  <section class="card now" id="now" hidden></section>
  <section class="card queue-card">
    <div class="queue-list" id="queue"></div>
    <div class="empty" id="queueEmpty">还没有点歌</div>
  </section>
  <footer>星幕 · 客厅电视点歌台</footer>
</div>
<script>
  // The page is opened from a signed QR link. The token binds this page to the device below, so
  // the stored "which TV" choice is gone: a phone cannot sign a link for a different device.
  let DEVICE_ID = __DEVICE_ID__;
  const API = "/api/music";
  const TOKEN = (function () {
    const match = /[?&]t=([^&#]+)/.exec(location.search || "");
    return match ? decodeURIComponent(match[1]) : "";
  })();
  const AUTH = TOKEN ? "?t=" + encodeURIComponent(TOKEN) : "";
  let linkExpired = false;
  const $ = (id) => document.getElementById(id);
  let quality = "MP3_320";
  let results = [];
  let stateData = null;
  let upcoming = [];
  let dragging = false;
  let dragId = "";
  let suppressUntil = 0;
  let pollTimer = 0;

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function say(text, kind) {
    const el = $("status");
    el.innerHTML = text;
    el.className = "status" + (kind ? " " + kind : "");
  }

  function toast(text, kind) {
    say(text, kind);
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { if ($("status").textContent === text) say(""); }, 4200);
  }

  async function api(path, options) {
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || ("HTTP " + response.status));
    return data;
  }

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      quality = chip.dataset.q;
      document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === chip));
    });
  });

  // ---- search ----

  function renderResults(list) {
    results = list;
    const box = $("results");
    if (!list.length) { box.innerHTML = '<div class="empty">没有找到，换个关键词试试</div>'; return; }
    box.innerHTML = list.map((song, i) =>
      '<div class="result">' +
        '<img class="cover" loading="lazy" referrerpolicy="no-referrer" src="' + esc(song.cover) + '" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="meta"><div class="name">' + esc(song.name) + '</div>' +
        '<div class="singer">' + esc(song.singer) + '</div>' +
        '<div class="album">' + esc(song.album || "") + (song.interval ? " · " + Math.floor(song.interval / 60) + ":" + String(song.interval % 60).padStart(2, "0") : "") + '</div></div>' +
        '<button class="pick" data-i="' + i + '">点歌</button>' +
      '</div>'
    ).join("");
    box.querySelectorAll(".pick").forEach((button) => {
      button.addEventListener("click", () => pick(parseInt(button.dataset.i, 10), button));
    });
  }

  async function search() {
    const keyword = $("q").value.trim();
    if (!keyword) { toast("先输入歌名或歌手", "bad"); return; }
    say('<span class="spin"></span>正在搜索…');
    try {
      const data = await api(API + "/search?q=" + encodeURIComponent(keyword) + "&limit=20");
      renderResults(data.data.list || []);
      say("找到 " + (data.data.list || []).length + " 首，点「点歌」推送到电视");
    } catch (error) {
      say("搜索失败：" + esc(error.message), "bad");
    }
  }

  async function pick(index, button) {
    const song = results[index];
    if (!song) return;
    button.disabled = true;
    say('<span class="spin"></span>正在点歌…');
    try {
      const data = await api(API + "/request", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          device_id: DEVICE_ID, mid: song.mid, name: song.name, singer: song.singer,
          album: song.album || "", cover: song.cover, interval: song.interval, quality: quality,
          t: TOKEN
        })
      });
      toast(data.delivered ? ("已点：" + esc(song.name) + "，电视马上播放") : ("已加入队列：" + esc(song.name) + "（电视暂时不在线）"), data.delivered ? "good" : "");
      suppressUntil = Date.now() + 600;
      setTimeout(loadState, 700);
    } catch (error) {
      toast("点歌失败：" + esc(error.message), "bad");
    } finally {
      button.disabled = false;
    }
  }

  // ---- live queue from the TV ----

  function currentSong() {
    if (!stateData) return null;
    const index = Number(stateData.index);
    const queue = stateData.queue || [];
    return index >= 0 && index < queue.length ? queue[index] : null;
  }

  function renderNow() {
    const song = currentSong();
    const box = $("now");
    if (!song) { box.hidden = true; return; }
    const playing = !!stateData.playing;
    box.hidden = false;
    box.innerHTML =
      '<img class="big-cover" referrerpolicy="no-referrer" src="' + esc(song.cover) + '" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="meta"><div class="name">' + esc(song.name) + '</div>' +
      '<div class="singer">' + esc(song.singer) + '</div>' +
      '<div class="badge ' + (playing ? "playing" : "") + '"><span class="dot"></span>' +
        (playing ? "正在播放" : (stateData.prepared ? "已暂停" : "正在缓冲")) +
        (song.quality ? " · " + esc(qualityShort(song.quality)) : "") + '</div></div>' +
      '<button class="skip" id="skipBtn">跳过</button>';
    $("skipBtn").addEventListener("click", () => deleteItem(song.id, true));
  }

  function qualityShort(key) {
    if (key.indexOf("MP3_") === 0) return "MP3 " + key.slice(4) + "K";
    if (key.indexOf("ACC_") === 0) return "AAC " + key.slice(4) + "K";
    if (key.indexOf("OGG_") === 0) return "OGG " + key.slice(4) + "K";
    return key;
  }

  function renderQueue() {
    if (dragging) return;
    const list = $("queue");
    const scrollTop = list.scrollTop;
    if (!upcoming.length) {
      list.innerHTML = "";
      $("queueEmpty").hidden = false;
    } else {
      $("queueEmpty").hidden = true;
      list.innerHTML = upcoming.map((song, index) =>
        '<div class="queue-item" data-id="' + esc(song.id) + '" draggable="true">' +
          '<div class="grip" title="拖动排序">≡</div>' +
          '<img class="cover" loading="lazy" referrerpolicy="no-referrer" src="' + esc(song.cover) + '" onerror="this.style.visibility=\'hidden\'">' +
          '<div class="meta"><div class="name">' + (index + 1) + '. ' + esc(song.name) + '</div>' +
          '<div class="singer">' + esc(song.singer) + '</div></div>' +
          '<button class="del" title="删除">×</button>' +
        '</div>'
      ).join("");
      list.querySelectorAll(".del").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          const row = button.closest(".queue-item");
          if (row) deleteItem(row.dataset.id, false);
        });
      });
      bindDrag();
    }
    $("queueCount").textContent = upcoming.length ? (upcoming.length + " 首待播") : "";
    list.scrollTop = scrollTop;
  }

  function render() {
    if (!stateData) return;
    const song = currentSong();
    const index = Number(stateData.index);
    const queue = stateData.queue || [];
    upcoming = (index >= 0 ? queue.slice(index + 1) : queue.slice());
    renderNow();
    renderQueue();
  }

  async function loadState() {
    if (linkExpired || dragging || Date.now() < suppressUntil) return;
    try {
      const data = await api(API + "/state/" + encodeURIComponent(DEVICE_ID) + AUTH);
      stateData = data;
      render();
    } catch (error) {
      // The state poll is a convenience; only the signed link expiring is worth saying out loud.
      if (!linkExpired && String(error.message).indexOf("失效") >= 0) {
        linkExpired = true;
        say("点歌链接已失效，请在电视上重新扫码", "bad");
      }
    }
  }

  async function deleteItem(id, current) {
    if (!id) return;
    suppressUntil = Date.now() + 500;
    try {
      await api(API + "/queue/" + encodeURIComponent(DEVICE_ID) + "/" + encodeURIComponent(id) + AUTH, { method: "DELETE" });
      toast(current ? "已跳过这首歌" : "已删除", "good");
      setTimeout(loadState, 500);
    } catch (error) {
      toast("删除失败：" + esc(error.message), "bad");
    }
  }

  // ---- drag ordering, desktop and touch ----

  function orderFromDom() {
    return Array.from(document.querySelectorAll("#queue .queue-item")).map((row) => row.dataset.id).filter(Boolean);
  }

  async function saveOrder() {
    const order = orderFromDom();
    if (!order.length) return;
    suppressUntil = Date.now() + 700;
    try {
      await api(API + "/queue/" + encodeURIComponent(DEVICE_ID) + AUTH, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({order: order, t: TOKEN})
      });
      toast("顺序已同步到电视", "good");
      setTimeout(loadState, 600);
    } catch (error) {
      toast("排序失败：" + esc(error.message), "bad");
      loadState();
    }
  }

  function bindDrag() {
    const list = $("queue");
    list.querySelectorAll(".queue-item").forEach((row) => {
      row.addEventListener("dragstart", (event) => {
        dragId = row.dataset.id;
        dragging = true;
        row.classList.add("dragging");
        if (event.dataTransfer) { event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", dragId); }
      });
      row.addEventListener("dragend", () => {
        dragging = false;
        row.classList.remove("dragging");
      });

      const grip = row.querySelector(".grip");
      if (!grip) return;
      grip.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 1) return;
        event.preventDefault();
        dragId = row.dataset.id;
        dragging = true;
        row.classList.add("dragging");
      }, {passive: false});
    });

    list.addEventListener("dragover", (event) => {
      if (!dragId) return;
      event.preventDefault();
      const draggingRow = list.querySelector('.queue-item[data-id="' + cssEscape(dragId) + '"]');
      if (!draggingRow) return;
      const after = afterRow(list, event.clientY);
      if (after == null) list.appendChild(draggingRow);
      else if (after !== draggingRow) list.insertBefore(draggingRow, after);
    });
    list.addEventListener("drop", (event) => {
      event.preventDefault();
      dragging = false;
      if (dragId) saveOrder();
      dragId = "";
    });
  }

  // Touch: move the dragged row under the finger; the list scrolls near its edges.
  document.addEventListener("touchmove", (event) => {
    if (!dragging || !dragId || !event.touches.length) return;
    event.preventDefault();
    const touch = event.touches[0];
    const list = $("queue");
    const draggingRow = list.querySelector('.queue-item[data-id="' + cssEscape(dragId) + '"]');
    if (!draggingRow) return;
    const under = document.elementFromPoint(touch.clientX, touch.clientY);
    const target = under && under.closest ? under.closest(".queue-item") : null;
    if (target && target !== draggingRow && list.contains(target)) {
      const rect = target.getBoundingClientRect();
      if (touch.clientY < rect.top + rect.height / 2) list.insertBefore(draggingRow, target);
      else list.insertBefore(draggingRow, target.nextSibling);
    }
    const box = list.getBoundingClientRect();
    if (touch.clientY < box.top + 34) list.scrollTop -= 8;
    else if (touch.clientY > box.bottom - 34) list.scrollTop += 8;
  }, {passive: false});

  document.addEventListener("touchend", () => {
    if (!dragging) return;
    dragging = false;
    document.querySelectorAll(".queue-item.dragging").forEach((row) => row.classList.remove("dragging"));
    if (dragId) saveOrder();
    dragId = "";
  });

  function afterRow(list, y) {
    const rows = Array.from(list.querySelectorAll(".queue-item:not(.dragging)"));
    let closest = null;
    let closestOffset = Number.NEGATIVE_INFINITY;
    for (const row of rows) {
      const box = row.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) { closestOffset = offset; closest = row; }
    }
    return closest;
  }

  function cssEscape(value) {
    return String(value).replace(/["\\]/g, "\\$&");
  }

  $("searchBtn").addEventListener("click", search);
  $("q").addEventListener("keydown", (event) => { if (event.key === "Enter") search(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadState(); });
  loadState();
  pollTimer = setInterval(loadState, 1500);

  /* 多电视切换只在控制台里做：手机页的签名只对扫码的那台电视有效，/api/music/devices 也不再公开。 */
</script>
</body>
